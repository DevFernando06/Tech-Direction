<div
    id="sidebarBackdrop"
    class="fixed inset-0 top-16 bg-brand-dark/60 backdrop-blur-xs z-30 hidden lg:hidden transition-opacity duration-300 motion-reduce:transition-none"
    aria-hidden="true"
></div>

<aside
    id="sidebar"
    aria-label="Menu lateral"
    class="fixed top-16 left-0 bottom-0 w-64 sm:w-60 bg-brand-dark p-4 text-slate-200 z-40 overflow-y-auto border-r border-white/10 shadow-xl lg:shadow-none transform -translate-x-full lg:translate-x-0 transition-transform duration-300 ease-in-out motion-reduce:transition-none"
>
    <nav aria-label="Navegação da plataforma" class="flex flex-col h-full justify-between gap-6">
        <div class="space-y-4">
            <div class="flex items-center justify-between px-3">
                <span class="text-[10px] font-bold uppercase tracking-wider text-slate-400 block">
                    Navegação
                </span>
                <button
                    type="button"
                    id="sidebarClose"
                    aria-label="Fechar menu lateral"
                    class="lg:hidden inline-flex items-center justify-center w-8 h-8 rounded-lg text-slate-400 hover:text-white hover:bg-white/10 transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-brand-lime"
                >
                    <i class="bi bi-x-lg text-sm" aria-hidden="true"></i>
                </button>
            </div>

            <ul class="space-y-1.5 list-none p-0 m-0">
                <li>
                    <a
                        href="{{ url_for('dashboard') }}"
                        {% if request.endpoint == 'dashboard' %}aria-current="page"{% endif %}
                        class="flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-sm font-semibold transition-all focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-brand-lime {{ 'bg-brand-blue text-white shadow-xs' if request.endpoint == 'dashboard' else 'text-slate-300 hover:bg-white/10 hover:text-white' }}"
                    >
                        <i class="bi bi-grid-fill text-base shrink-0" aria-hidden="true"></i>
                        <span>Início</span>
                    </a>
                </li>
                <li>
                    <a
                        href="{{ url_for('search_trilha') }}"
                        {% if request.endpoint in ['search_trilha', 'view_trilha', 'cad_trilha'] %}aria-current="page"{% endif %}
                        class="flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-sm font-semibold transition-all focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-brand-lime {{ 'bg-brand-blue text-white shadow-xs' if request.endpoint in ['search_trilha', 'view_trilha', 'cad_trilha'] else 'text-slate-300 hover:bg-white/10 hover:text-white' }}"
                    >
                        <i class="bi bi-journal-code text-base shrink-0" aria-hidden="true"></i>
                        <span>Trilhas</span>
                    </a>
                </li>
                <li>
                    <a
                        href="{{ url_for('writers') }}"
                        {% if request.endpoint in ['writers', 'cad_writer'] %}aria-current="page"{% endif %}
                        class="flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-sm font-semibold transition-all focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-brand-lime {{ 'bg-brand-blue text-white shadow-xs' if request.endpoint in ['writers', 'cad_writer'] else 'text-slate-300 hover:bg-white/10 hover:text-white' }}"
                    >
                        <i class="bi bi-people text-base shrink-0" aria-hidden="true"></i>
                        <span>Escritores</span>
                    </a>
                </li>
            </ul>
        </div>

        <div class="pt-4 border-t border-white/10 mt-auto">
            <a
                href="{{ url_for('logout') }}"
                class="flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-sm font-semibold text-slate-400 hover:bg-white/10 hover:text-brand-coral transition-all focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-brand-lime"
            >
                <i class="bi bi-box-arrow-right text-base shrink-0" aria-hidden="true"></i>
                <span>Sair da conta</span>
            </a>
        </div>
    </nav>
</aside>
<div
    id="sidebarSpacer"
    class="hidden lg:block lg:w-60 shrink-0 transition-all duration-300 ease-in-out motion-reduce:transition-none"
    aria-hidden="true"
></div>
