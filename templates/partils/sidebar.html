<aside class="sidebar fixed top-16 left-0 bottom-0 w-60 bg-[#0f172a] p-4 text-slate-200 z-30 overflow-y-auto" aria-label="Menu lateral">
    <nav aria-label="Navegação da plataforma" class="flex flex-col h-full justify-between gap-6">
        <div class="space-y-4">
            <span class="text-[10px] font-bold uppercase tracking-wider text-slate-400 px-3 block">
                Navegação
            </span>
            <ul class="sidebar-nav space-y-1.5 list-none p-0 m-0">
                <li>
                    <a
                        href="{{ url_for('dashboard') }}"
                        {% if request.endpoint == 'dashboard' %}aria-current="page"{% endif %}
                        class="sidebar-link flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-sm font-semibold transition-all focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-brand-lime {{ 'bg-[#1757AA] text-white shadow-xs' if request.endpoint == 'dashboard' else 'text-slate-300 hover:bg-slate-800 hover:text-white' }}"
                    >
                        <i class="bi bi-grid-fill text-base" aria-hidden="true"></i>
                        <span>Início</span>
                    </a>
                </li>
                <li>
                    <a
                        href="{{ url_for('search_trilha') }}"
                        {% if request.endpoint in ['search_trilha', 'view_trilha', 'cad_trilha'] %}aria-current="page"{% endif %}
                        class="sidebar-link flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-sm font-semibold transition-all focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-brand-lime {{ 'bg-[#1757AA] text-white shadow-xs' if request.endpoint in ['search_trilha', 'view_trilha', 'cad_trilha'] else 'text-slate-300 hover:bg-slate-800 hover:text-white' }}"
                    >
                        <i class="bi bi-journal-code text-base" aria-hidden="true"></i>
                        <span>Trilhas</span>
                    </a>
                </li>
                <li>
                    <a
                        href="{{ url_for('writers') }}"
                        {% if request.endpoint in ['writers', 'cad_writer'] %}aria-current="page"{% endif %}
                        class="sidebar-link flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-sm font-semibold transition-all focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-brand-lime {{ 'bg-[#1757AA] text-white shadow-xs' if request.endpoint in ['writers', 'cad_writer'] else 'text-slate-300 hover:bg-slate-800 hover:text-white' }}"
                    >
                        <i class="bi bi-people text-base" aria-hidden="true"></i>
                        <span>Escritores</span>
                    </a>
                </li>
            </ul>
        </div>

        <div class="pt-4 border-t border-slate-800/80 mt-auto">
            <a
                href="{{ url_for('login') }}"
                class="sidebar-link flex items-center gap-3 px-3.5 py-2 rounded-xl text-sm font-semibold text-slate-400 hover:bg-slate-800 hover:text-red-400 transition-all focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-brand-lime"
            >
                <i class="bi bi-box-arrow-right text-base" aria-hidden="true"></i>
                <span>Sair da conta</span>
            </a>
        </div>
    </nav>
</aside>
<div class="w-60 shrink-0" aria-hidden="true"></div>
