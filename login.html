<!DOCTYPE html>
<html lang="pt-br">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./assets/css/main.css">
    <link rel="stylesheet" href="./assets/css/login.css">
    <title>Login - Tech Direction</title>
</head>
<body>
    <main>
        <aside class="center">
            <h1>Tech Direction</h1>
        </aside>

        <section class="center">
            <form action="./dashboard.html" method="post">
            <h1>Bem-vindo (a)</h1>
            <label for="login">Login</label>
            <input class="input-text" type="text" name="login" id="login" placeholder="Seu Login" required>
            <label for="password">Senha</label>
            <input class="input-text" type="password" name="password" id="password" placeholder="Sua senha" required>
            <button type="submit">Entrar</button>
            <a class="forgot-password" href="#">Esqueci minha senha</a>
        </form>
        <span href="#">É novo aqui? <a href="#">Criar conta</a></span>
    </section> 
     
    </main>
