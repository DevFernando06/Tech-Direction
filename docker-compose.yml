# PostgreSQL local para desenvolvimento.
# Uso: docker compose up -d      (sobe o banco)
#      docker compose down       (para; os dados ficam guardados no volume)
# Se você já tem um PostgreSQL instalado, não precisa deste arquivo:
# basta apontar o DATABASE_URL do .env para ele.
services:
  db:
    image: postgres:16
    container_name: techdirection-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: techdirection
      POSTGRES_PASSWORD: techdirection_dev
      POSTGRES_DB: techdirection
    ports:
      - "5432:5432"
    volumes:
      - techdirection_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U techdirection -d techdirection"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  techdirection_pgdata:
