<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./assets/css/main.css">
    <link rel="stylesheet" href="./assets/css/login.css">
    <title>Cadastro - Tech Direction</title>
</head>
<body>
    <main>
        <aside class="center">
            <h1>Tech Direction</h1>
        </aside>

        <section class="center">
            <form action="./login.html" method="post">
                <h2>Bem-vindo (a)</h2>
                <label for="userName">Nome <span class="required">*</span></label>
                <input class="input-text" type="text" name="userName" id="userName" placeholder="Seu Nome" required>
                <label for="login">Login <span class="required">*</span></label>
                <input class="input-text" type="text" name="login" id="login" placeholder="Seu Nome" required>
                <label for="userEmail">Email <span class="required">*</span></label>
                <input class="input-text" type="email" name="userEmail" id="userEmail" placeholder="Seu email" required>
                <label for="dateBirth">Data de Nascimento <span class="required">*</span></label>
                <input class="input-text" type="date" name="dateBirth" id="dateBirth" placeholder="" required>
                <label for="password">Senha <span class="required">*</span></label>
                <input class="input-text" type="password" name="password" id="password" placeholder="Sua senha" required>
                <label for="confirmPassword">Confirmar Senha <span class="required">*</span></label>
                <input class="input-text" type="password" name="confirmPassword" id="confirmPassword" placeholder="Confirme sua senha" required>
                <button type="submit">Entrar</button>
                <a class="forgot-password" href="#">Esqueci minha senha</a>
            </form>
            <span>Ja tem conta? <a href="./login.html">Entrar</a></span>
        </section> 
     
    </main>

</body>
</html>
